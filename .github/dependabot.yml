version: 2
updates:
  # The docs site's root pnpm project.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Supply-chain safeguard: skip releases until they have aged.
    cooldown:
      default-days: 5
      semver-major-days: 14
    # No dependency labels exist in this repo; [] stops Dependabot creating them.
    labels: []
    # Conventional Commits, as the commitlint commit-msg hook expects: fix(deps)
    # when a runtime dependency changes, chore(deps-dev) otherwise.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Minor and patch updates share one PR, and majors share another.
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Tracks the Node.js major in .nvmrc; move it with a Node upgrade.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # Example apps under content/platform/examples; directories without a
  # package.json are skipped. SDK majors ship with coordinated docs changes,
  # and Next.js majors follow the runtimes Volcano supports.
  - package-ecosystem: "npm"
    directories:
      - "/content/platform/examples/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 30
    labels: []
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "@volcano.dev/*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-major"
    groups:
      examples:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      examples-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Keep SHA-pinned GitHub Actions (and their `# vX.Y.Z` comments) current.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # GitHub Actions supports only default-days, not per-SemVer cooldowns.
    cooldown:
      default-days: 5
    labels: []
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Same policy as the npm group above.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
