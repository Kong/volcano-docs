name: Lint Volcano docs
description: Validate source-repository docs against the shared Volcano format

inputs:
  path:
    description: Directory to lint, relative to the caller repository root
    default: docs

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.16.1
        package_json_file: .volcano-docs-lint/no-package.json

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24

    - name: Install lint tooling
      shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}/../../..
      run: |
        cd "$TOOL_ROOT"
        pnpm install --frozen-lockfile --ignore-scripts

    - name: Lint
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        TOOL_ROOT: ${{ github.action_path }}/../../..
      run: node "$TOOL_ROOT/scripts/lint-docs.mjs" "$GITHUB_WORKSPACE/$INPUT_PATH"
