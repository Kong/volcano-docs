name: Deploy docs to volcano.dev
run-name: volcano.dev docs — ${{ github.sha }}

# Deploys this repository as the `docs` frontend of the production project that
# serves volcano.dev, which mounts it at /docs, /blog, and /cookbooks with
# Frontend routes. Git auto-deploy keeps deploying the same commits to the docs
# project, where LavaFlow fixes them; Frontend routes mount only a Frontend of
# the same Project, so volcano.dev needs this second copy.
#
# The `volcano-dev` environment must allow only the main branch. It holds the
# variables VOLCANO_DEV_PROJECT_ID, NEXT_PUBLIC_POSTHOG_KEY, and
# NEXT_PUBLIC_POSTHOG_HOST (the docs project's values; the build inlines them,
# and the Blog header link waits on a PostHog flag), and the secret
# VOLCANO_DEV_TOKEN, a project access token for that project.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-volcano-dev
  cancel-in-progress: false

jobs:
  # Uploads source only (Volcano builds remotely), so no dependency install
  # runs next to the token. A commit that fails to build fails here too, and
  # volcano.dev keeps serving the last deployment that built; the docs
  # project's LavaFlow opens the fix.
  deploy:
    name: Deploy docs frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: volcano-dev
    timeout-minutes: 25
    env:
      VOLCANO_PROJECT: ${{ vars.VOLCANO_DEV_PROJECT_ID }}
      DOCS_SITE_URL: https://volcano.dev
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - name: Check project configuration
        run: |
          for name in VOLCANO_PROJECT NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_POSTHOG_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; set it on the volcano-dev environment."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Volcano CLI
        uses: ./.github/actions/install-volcano-cli

      - name: Authenticate with Volcano
        env:
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_DEV_TOKEN }}
        run: |
          if [ -z "$VOLCANO_TOKEN" ]; then
            echo "::error::VOLCANO_DEV_TOKEN is empty; refusing to fall back to interactive browser auth."
            exit 1
          fi
          volcano login --token "$VOLCANO_TOKEN" --project "$VOLCANO_PROJECT"

      # Not shared, so the project's functions never receive them; the frontend
      # selects them by name.
      - name: Set docs build variables
        env:
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_DEV_TOKEN }}
        run: |
          {
            printf 'DOCS_SITE_URL=%s\n' "$DOCS_SITE_URL"
            printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "$NEXT_PUBLIC_POSTHOG_KEY"
            printf 'NEXT_PUBLIC_POSTHOG_HOST=%s\n' "$NEXT_PUBLIC_POSTHOG_HOST"
          } > "$RUNNER_TEMP/docs.env"
          volcano cloud variables deploy --file "$RUNNER_TEMP/docs.env" --shared=false

      - name: Deploy and wait for frontend
        id: frontend
        env:
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_DEV_TOKEN }}
        run: node scripts/deploy-volcano-dev.mjs

      - name: Smoke test deployed frontend
        env:
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
        run: |
          search_index_path="$(sed -n 's/^export const SEARCH_INDEX_PATH = "\(\/[^" ]*\)";$/\1/p' src/lib/search-index-client.mjs)"
          : "${search_index_path:?Docs search-index path is missing}"
          for path in /docs /docs/get-started/what-is-volcano /docs/index.md /blog /cookbooks "$search_index_path"; do
            curl -fsS -o /dev/null "$FRONTEND_URL$path"
          done
          {
            echo "## volcano.dev docs frontend"
            echo "- $FRONTEND_URL/docs"
            echo "- Source: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
