name: Sync docs

# Pulls docs from the internal source repos into content/<section>/ and opens a
# PR that auto-merges. Runs daily (not merge-triggered) to keep commit noise low.
#
# Default-branch-ONLY triggers by design: schedule and repository_dispatch both
# always execute this file + scripts from the default branch, so no feature
# branch can inject exfiltration code that runs with the App-minted read token.
# workflow_dispatch is deliberately NOT used — it runs a caller-chosen ref's
# YAML/scripts with secrets, which lets any write collaborator read the full
# source repos (a confused-deputy path). Change the sync by merging to the
# default branch (gated by branch protection), not by dispatching a branch.
#
# Manual on-demand run (always uses default-branch code):
#   gh api repos/Kong/volcano-docs/dispatches -f event_type=sync-docs
# Single section only:
#   gh api repos/Kong/volcano-docs/dispatches -f event_type=sync-docs \
#     -f 'client_payload[source]=content/cli'
#
# Authenticates as the Volcano GitHub App (vars.VOLCANO_APP_ID + secrets.VOLCANO_APP_KEY).
# The App must be installed on volcano-docs and every source repo in docs.config.yaml.

on:
  schedule:
    - cron: "13 6 * * *" # daily ~06:13 UTC (off the top of the hour)
  repository_dispatch:
    types: [sync-docs]

# No ambient GITHUB_TOKEN use: auth is entirely via the App-minted tokens below.
permissions: {}

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Read-only token for the internal source repos.
      - name: Mint source-repo read token
        id: src-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.VOLCANO_APP_ID }}
          private-key: ${{ secrets.VOLCANO_APP_KEY }}
          owner: Kong
          repositories: |
            volcano-hosting
            volcano-sdk-js
            volcano-cli
          permission-contents: read

      # Write token scoped to this repo only, for the branch/PR/merge.
      - name: Mint docs write token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.VOLCANO_APP_ID }}
          private-key: ${{ secrets.VOLCANO_APP_KEY }}
          owner: Kong
          repositories: volcano-docs
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Always branch the sync from the default branch regardless of the
          # dispatch ref, so a non-default workflow_dispatch ref can't land
          # unrelated commits on main via the auto-merge below.
          ref: main
          # Don't persist the write token in .git/config: the build step below
          # compiles untrusted MDX from the source repos. The token is supplied
          # explicitly only for the final push.
          persist-credentials: false

      - name: Pull docs from source repos
        env:
          GH_TOKEN: ${{ steps.src-token.outputs.token }}
          # Empty on schedule (syncs all); set via client_payload on manual dispatch.
          ONLY: ${{ github.event.client_payload.source }}
        run: bash scripts/sync-docs.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate synced docs (fail before committing)
        # Same gate as PR CI: format lint, route-aware link check, real build.
        # A broken sync fails here and never opens/merges a PR.
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint:docs content
          pnpm check:links
          pnpm build

      - name: Open PR and auto-merge if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # content/{platform,sdk,cli} is committed (not gitignored) so the
          # frontend deploy, which packages from .gitignore, keeps it. Internal
          # docs are excluded at the source (docs/public only).
          git add content
          if git diff --cached --quiet; then
            echo "No doc changes."
            exit 0
          fi

          branch="docs-sync/$(date -u +%Y%m%d-%H%M%S)"
          title="docs: sync from source repos $(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title"
          # persist-credentials:false on checkout, so push with the token explicitly.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

          gh pr create --base main --head "$branch" \
            --title "$title" \
            --body "Automated docs sync. Sources: docs.config.yaml."
          # Arm auto-merge so it lands once any required checks pass; if the repo
          # has no auto-merge / no required checks, GitHub rejects --auto, so
          # fall back to an immediate squash.
          gh pr merge "$branch" --auto --squash --delete-branch \
            || gh pr merge "$branch" --squash --delete-branch
