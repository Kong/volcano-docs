name: Lint docs (reusable)

# Shared docs-format check. Source repos call this from their own PR CI so the
# rules live in one place. See spec/markdown-format.md.
#
# Caller example (put in the source repo, e.g. .github/workflows/lint-docs.yml):
#
#   name: Lint docs
#   on:
#     pull_request:
#       paths: ["docs/**"]
#   jobs:
#     docs:
#       uses: Kong/volcano-docs/.github/workflows/lint-docs.yml@main
#       with:
#         path: docs

on:
  workflow_call:
    inputs:
      path:
        description: "Directory to lint (relative to the caller repo root)."
        type: string
        default: docs

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        uses: Kong/volcano-docs/.github/actions/lint-docs@main
        with:
          path: ${{ inputs.path }}
