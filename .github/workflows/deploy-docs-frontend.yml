name: Deploy frontend docs route for volcano web
run-name: Deploy frontend docs route for volcano web — ${{ github.sha }}

# Deploys this repository as the `docs` frontend of volcano-web's project,
# which mounts it at /docs, /blog, and /cookbook with Frontend routes:
# staging.volcano.dev first, then volcano.dev once staging succeeds. Git
# auto-deploy keeps deploying the same commits to the docs projects, where
# LavaFlow fixes them; Frontend routes mount only a Frontend of the same
# Project, so volcano-web's project needs this second copy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-frontend
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-docs-frontend-environment.yml
    with:
      environment: staging
      site_url: https://staging.volcano.dev
    # A called workflow sees its job environment's secrets only under names
    # the caller passes; the environment's values replace the caller's.
    secrets:
      VOLCANO_API_URL: ${{ secrets.VOLCANO_API_URL }}
      VOLCANO_WEB_PROJECT_ID: ${{ secrets.VOLCANO_WEB_PROJECT_ID }}
      VOLCANO_WEB_TOKEN: ${{ secrets.VOLCANO_WEB_TOKEN }}

  production:
    name: Production
    needs: staging
    uses: ./.github/workflows/deploy-docs-frontend-environment.yml
    with:
      environment: production
      site_url: https://volcano.dev
    secrets:
      VOLCANO_API_URL: ${{ secrets.VOLCANO_API_URL }}
      VOLCANO_WEB_PROJECT_ID: ${{ secrets.VOLCANO_WEB_PROJECT_ID }}
      VOLCANO_WEB_TOKEN: ${{ secrets.VOLCANO_WEB_TOKEN }}
