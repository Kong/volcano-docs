name: CI

# Site-level validation for every PR (including the scheduled sync's PRs):
# the docs-format lint, a route-aware link check, and a real Next build.
# Source-repo format lint cannot catch integration failures (relocated index
# links, cross-section routes, unserved assets, a broken build) — this can.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build and search index follow symlinks, so one could pull files
      # from outside content/ into the public site. The sync refuses them
      # (scripts/sync-docs.sh); this stops a hand-made PR from adding one.
      - name: Refuse symlinks in content and public
        run: bash scripts/refuse-symlinks.sh content public

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint docs format
        run: pnpm lint:docs content

      - name: Check links and routes
        run: pnpm check:links

      - name: Test reusable actions
        run: pnpm test:actions

      - name: Test docs tooling
        run: pnpm test:docs

      - name: Build
        run: pnpm build
