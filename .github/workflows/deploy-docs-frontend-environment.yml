name: Deploy docs frontend to one environment

# Called by deploy-docs-frontend.yml, once for staging and once for production.
# Each GitHub environment must allow only the main branch and holds, under the
# same names volcano-web uses for its project:
#   secrets   VOLCANO_API_URL, VOLCANO_PROJECT_ID (volcano-web's project),
#             VOLCANO_TOKEN (a project access token for it)
#   variables NEXT_PUBLIC_POSTHOG_KEY, NEXT_PUBLIC_POSTHOG_HOST (the docs
#             project's values; the build inlines them, and the Blog header
#             link waits on a PostHog flag)
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      site_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Uploads source only (Volcano builds remotely), so no dependency install
  # runs next to the token. A commit that fails to build fails here too, and
  # the site keeps serving the last deployment that built; the docs project's
  # LavaFlow opens the fix.
  deploy:
    name: Deploy docs frontend
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 25
    env:
      VOLCANO_API_URL: ${{ secrets.VOLCANO_API_URL }}
      VOLCANO_PROJECT: ${{ secrets.VOLCANO_PROJECT_ID }}
      DOCS_SITE_URL: ${{ inputs.site_url }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - name: Check project configuration
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VOLCANO_PROJECT_ID: ${{ secrets.VOLCANO_PROJECT_ID }}
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_TOKEN }}
        # Checks the names as the environment holds them, so the error names
        # the secret or variable to set.
        run: |
          for name in VOLCANO_API_URL VOLCANO_PROJECT_ID VOLCANO_TOKEN NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_POSTHOG_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty; set it on the $ENVIRONMENT environment."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Volcano CLI
        uses: ./.github/actions/install-volcano-cli

      - name: Authenticate with Volcano
        env:
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_TOKEN }}
        run: volcano login --token "$VOLCANO_TOKEN" --project "$VOLCANO_PROJECT"

      # Not shared, so the project's functions never receive them; the frontend
      # selects them by name.
      - name: Set docs build variables
        env:
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_TOKEN }}
        run: |
          {
            printf 'DOCS_SITE_URL=%s\n' "$DOCS_SITE_URL"
            printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "$NEXT_PUBLIC_POSTHOG_KEY"
            printf 'NEXT_PUBLIC_POSTHOG_HOST=%s\n' "$NEXT_PUBLIC_POSTHOG_HOST"
          } > "$RUNNER_TEMP/docs.env"
          volcano cloud variables deploy --file "$RUNNER_TEMP/docs.env" --shared=false

      - name: Deploy and wait for frontend
        id: frontend
        env:
          VOLCANO_TOKEN: ${{ secrets.VOLCANO_TOKEN }}
        run: node scripts/deploy-docs-frontend.mjs

      - name: Smoke test deployed frontend
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          FRONTEND_URL: ${{ steps.frontend.outputs.url }}
        run: |
          search_index_path="$(sed -n 's/^export const SEARCH_INDEX_PATH = "\(\/[^" ]*\)";$/\1/p' src/lib/search-index-client.mjs)"
          : "${search_index_path:?Docs search-index path is missing}"
          for path in /docs /docs/get-started/what-is-volcano /docs/index.md /blog /cookbook "$search_index_path"; do
            curl -fsS -o /dev/null "$FRONTEND_URL$path"
          done
          {
            echo "## Docs frontend ($ENVIRONMENT)"
            echo "- $FRONTEND_URL/docs"
            echo "- Source: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
