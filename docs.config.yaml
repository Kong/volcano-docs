# Site manifest for the Volcano developer docs. scripts/lint-docs.mjs reads
# `nav` to validate site-absolute links between sections.

site:
  title: Volcano Developer Docs
  base_url: https://docs.volcano.dev

# Top-level section order. Pages within a section are ordered by the `order`
# frontmatter field, then alphabetically.
nav:
  - get-started
  - platform
  - sdk
  - cli
  - cookbooks
  - blog
